name: CI

on:
  push:
    branches:
      - main
      - hardening/**
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen

      - name: Build warning-free API documentation
        run: doxygen Doxyfile

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32s3dev
          - esp32s2dev
          - owner_safe_s3
          - owner_safe_s2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio==6.1.19

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio==6.1.19

      - name: Enforce core timing guard
        run: python tools/check_core_timing_guard.py

      - name: Run native tests
        run: pio test -e native

  esp-idf-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.5@sha256:114a9f8cde8bdc5a7e95809745b492663f7c5afe9c2821a4127ff133754fafd2
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32s3
          - esp32s2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build ESP-IDF example (${{ matrix.target }})
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C examples/esp_idf/basic set-target ${{ matrix.target }} build

  validate-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Enforce example CLI contract
        run: python tools/check_cli_contract.py

      - name: Check ADS1115 HIL runner parser
        run: |
          python tools/run_i2c_hil.py --parser-test
          python tools/run_i2c_hil.py --dry-run --address 0x48 --address 0x49 --suite targeted

      - name: Enforce ESP-IDF example contract
        run: python tools/check_idf_example_contract.py

      - name: Check version metadata
        run: python scripts/generate_version.py check

      - name: Validate library package
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("library.json", encoding="utf-8"))["version"])')"
          archive="$RUNNER_TEMP/ADS1115-${version}.tar.gz"
          unpacked="$RUNNER_TEMP/ads1115-package"
          pio pkg pack --output "$archive"
          mkdir -p "$unpacked"
          tar -xzf "$archive" -C "$unpacked"
          test -f "$unpacked/include/ADS1115/Version.h"
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I"$unpacked/include" -fsyntax-only "$unpacked/src/ADS1115.cpp"

